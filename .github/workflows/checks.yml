name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt PyYAML
      - name: JavaScript syntax and regression tests
        run: |
          for source in extension/*.js; do node --check "$source"; done
          node --test tests/*.test.mjs
      - name: Python syntax and regression tests
        run: |
          python -m py_compile home-assistant/youtube_handoff.py
          python tests/youtube_handoff_test.py
      - name: YAML examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('home-assistant').glob('*.yaml'):
              assert isinstance(yaml.safe_load(path.read_text()), dict), path
              print('Parsed', path)
          PY
